[theme]
base = "light"
primaryColor = "#2D3142"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#2D3142"
borderColor = "#E4E6EB"
redColor = "#C04C36"
orangeColor = "#E6A65D"
yellowColor = "#E6A65D"
greenColor = "#40814B"
grayColor = "#6B7080"
chartCategoricalColors = ["#2D3142", "#C04C36", "#E6A65D", "#40814B"]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "large"
buttonRadius = "full"
linkUnderline = false
showWidgetBorder = true

[server]
maxUploadSize = 20

[client]
toolbarMode = "minimal"
